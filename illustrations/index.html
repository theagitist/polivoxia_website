<div class="wrap">

  <div class="masthead-links"><a class="back" href="/">&larr; polivoxia.ca</a></div>

  <div class="grid" id="grid">
    <button class="shot" data-full="img/portrait-1.jpg" data-cap="Profile study in teal, silhouetted against a wall of fire.">

    </button>
    <button class="shot" data-full="img/portrait-3.jpg" data-cap="Blue linocut-style portrait on a warm wood-grain field.">
      <picture><source srcset="img/portrait-3.webp" type="image/webp"><img src="img/portrait-3.jpg" loading="lazy" alt="Blue duotone woodcut-style portrait of a smiling person with a hand at their chest, over a golden wood-grain texture."></picture>
    </button>
    <button class="shot" data-full="img/portrait-4.jpg" data-cap="Stencil portrait banded across the trans pride flag.">
      <picture><source srcset="img/portrait-4.webp" type="image/webp"><img src="img/portrait-4.jpg" loading="lazy" alt="High-contrast stencil portrait of a long-haired person, overlaid with the diagonal blue, pink and white stripes of the trans pride flag."></picture>
    </button>

    </button>

      <picture><source srcset="img/portrait-5.webp" type="image/webp"><img src="img/portrait-5.jpg" loading="lazy" alt="Sepia-toned pop-art portrait of a person resting their chin on a hand, over a swirling orange and green background."></picture>
    </button>
    <button class="shot" data-full="img/portrait-6.jpg" data-cap="Green duotone portrait on a multicolour swirl.">
      <picture><source srcset="img/portrait-6.webp" type="image/webp"><img src="img/portrait-6.jpg" loading="lazy" alt="Green duotone portrait of a person resting their chin on a fist, over a swirling orange and purple background."></picture>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close">&times;</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous">&#8249;</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next">&#8250;</button>
  <div class="lb-cap" id="lbCap"></div>
</div>

<script>
(function () {
  var items = Array.prototype.slice.call(document.querySelectorAll('.shot'));
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbCap = document.getElementById('lbCap');
  var idx = 0;

  function show() {
    var el = items[idx];
    lbImg.src = el.dataset.full;
    lbImg.alt = el.querySelector('img').alt;
    lbCap.textContent = el.dataset.cap || '';
  }
  function open(i) {
    idx = i; show();
    lb.classList.add('open');
    lb.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function close() {
    lb.classList.remove('open');
    lb.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    lbImg.src = '';
  }
  function step(n) { idx = (idx + n + items.length) % items.length; show(); }

  items.forEach(function (el, i) { el.addEventListener('click', function () { open(i); }); });
  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbPrev').addEventListener('click', function () { step(-1); });
  document.getElementById('lbNext').addEventListener('click', function () { step(1); });
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });
})();
</script>
</body>
</html>
