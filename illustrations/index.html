<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Illustration viewer" aria-hidden="true">
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close">&times;</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous">&#8249;</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next">&#8250;</button>
  <div class="lb-cap" id="lbCap"></div>
</div>

<script>
// masonry: each item spans as many 6px grid rows as its clipping is tall (plus the 2.4rem gap below it)
(function () {
  var grid = document.getElementById('grid'), shots = grid.querySelectorAll('.shot');
  function layout() {
    var gap = parseFloat(getComputedStyle(shots[0]).marginBottom);
    shots.forEach(function (s) { s.style.gridRowEnd = 'span ' + Math.ceil((s.firstElementChild.offsetHeight + gap) / 6); });
  }
  grid.classList.add('masonry'); layout();
  grid.querySelectorAll('img').forEach(function (img) { if (!img.complete) img.addEventListener('load', layout); });
  addEventListener('resize', layout);
})();

(function () {
  var items = Array.prototype.slice.call(document.querySelectorAll('.shot'));
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbCap = document.getElementById('lbCap');
  var idx = 0;

  function show() {
    var el = items[idx];
    lbImg.src = el.dataset.full;
    lbImg.alt = el.querySelector('img').alt;
    lbCap.textContent = el.dataset.cap || '';
    if (el.dataset.link) {
      var a = document.createElement('a');
      a.href = el.dataset.link;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'see the full gallery →';
      lbCap.appendChild(document.createTextNode(' '));
      lbCap.appendChild(a);
    }
  }
  var opener = null;
  function open(i) {
    opener = items[i];
    idx = i; show();
    lb.classList.add('open');
    lb.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    document.getElementById('lbClose').focus();
  }
  function close() {
    lb.classList.remove('open');
    lb.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    lbImg.src = '';
    if (opener) opener.focus();
  }
  function step(n) { idx = (idx + n + items.length) % items.length; show(); }

  items.forEach(function (el, i) { el.addEventListener('click', function () { open(i); }); });
  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbPrev').addEventListener('click', function () { step(-1); });
  document.getElementById('lbNext').addEventListener('click', function () { step(1); });
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'Tab') { var b = lb.querySelectorAll('button, a'); var f = b[0], l = b[b.length - 1];
      if (e.shiftKey && document.activeElement === f) { e.preventDefault(); l.focus(); }
      else if (!e.shiftKey && document.activeElement === l) { e.preventDefault(); f.focus(); } }
  });
})();
</script>
