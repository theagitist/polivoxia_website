<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.png">
<style>
  *{box-sizing:border-box}
  html{color-scheme:light dark}
  :root{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Caníbal o Antropófago</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Spectral:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --paper:#efe7d6; --ink:#16120c; --red:#c1121f;
    --faint:rgba(22,18,12,.26); --rule:rgba(22,18,12,.2); --hint:rgba(22,18,12,.5);
    --disp:"Anton",Impact,"Haettenschweiler",sans-serif;
    --body:"Spectral",Georgia,"Times New Roman",serif;
    --mono:"Space Mono",ui-monospace,"Courier New",monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#0e0c09; --ink:#efe7d6; --red:#e5493b;
    --faint:rgba(239,231,214,.24); --rule:rgba(239,231,214,.18); --hint:rgba(239,231,214,.55);
  }}
  :root[data-theme="dark"]{
    --paper:#0e0c09; --ink:#efe7d6; --red:#e5493b;
    --faint:rgba(239,231,214,.24); --rule:rgba(239,231,214,.18); --hint:rgba(239,231,214,.55);
  }

  body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.55;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .wrap{max-width:44rem;margin:0 auto;padding-inline:20px;}
  a{color:var(--red);text-underline-offset:3px;text-decoration-thickness:1px;}
  a:focus-visible{outline:2px solid var(--red);outline-offset:2px;}

  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;
    background:color-mix(in srgb,var(--paper) 88%,transparent);
    backdrop-filter:blur(6px);border-bottom:1.5px solid var(--ink);}
  .bar{max-width:44rem;margin:0 auto;padding:10px 20px;display:flex;align-items:center;
    justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brand{font-family:var(--mono);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11px;}
  .navr{display:flex;align-items:center;gap:14px;}
  .navr a{font-family:var(--mono);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    font-size:11px;text-decoration:none;}
  .toggle{display:flex;gap:2px;border:1.5px solid var(--ink);}
  .toggle button{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.1em;
    background:transparent;color:var(--ink);border:0;padding:8px 11px;min-height:36px;cursor:pointer;}
  .toggle button[aria-pressed="true"]{background:var(--ink);color:var(--paper);}
  .toggle button:focus-visible{outline:2px solid var(--red);outline-offset:2px;}

  .hero{padding-block:12vh 7vh;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--red);margin:0 0 1.2rem;}
  h1.hero-t{font-family:var(--disp);font-weight:400;text-transform:uppercase;line-height:.86;
    font-size:clamp(3rem,15vw,8rem);margin:0;letter-spacing:-.01em;word-break:break-word;color:var(--red);}
  h1.hero-t .o{color:var(--ink);display:block;font-size:.42em;letter-spacing:.04em;margin:.12em 0;}
  .thesis{font-family:var(--disp);font-weight:400;text-transform:uppercase;line-height:.98;
    font-size:clamp(1.3rem,5.4vw,2.1rem);margin:.6rem 0 0;text-wrap:balance;}

  section{padding-block:2.6rem;border-top:1.5px solid var(--rule);}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--hint);margin:0 0 .5rem;}
  h2{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.01em;
    font-size:clamp(1.9rem,8vw,3rem);line-height:.98;margin:0 0 1.2rem;}
  p{font-size:clamp(1.08rem,3.4vw,1.22rem);margin:0 0 1.1rem;text-wrap:pretty;}
  .red{color:var(--red);} b{font-weight:600;} i,em{font-style:italic;}

  .arrow{font-family:var(--disp);text-transform:uppercase;color:var(--red);
    font-size:clamp(1.4rem,6vw,2.2rem);letter-spacing:.02em;margin:.4rem 0 1.4rem;line-height:1.02;}

  blockquote{margin:1.2rem 0;padding-left:1rem;border-left:3px solid var(--red);
    font-family:var(--disp);text-transform:uppercase;font-weight:400;color:var(--red);
    font-size:clamp(1.3rem,5.6vw,2rem);line-height:1.03;}

  ol.guion{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2.2rem;}
  ol.guion>li{display:flex;gap:1rem;align-items:baseline;}
  ol.guion .num{font-family:var(--disp);color:var(--red);font-size:clamp(2.4rem,11vw,4rem);
    line-height:.8;flex:0 0 auto;min-width:1.4ch;}
  ol.guion .step{flex:1 1 auto;}
  ol.guion .step h3{font-family:var(--disp);font-weight:400;text-transform:uppercase;
    font-size:clamp(1.3rem,5vw,1.7rem);margin:.1rem 0 .5rem;line-height:1;}
  .time{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--hint);margin:0 0 .3rem;}
  ol.guion .step p{font-size:1.08rem;margin:0 0 .7rem;}
  ol.guion .step blockquote{font-size:clamp(1.15rem,5vw,1.6rem);}

  ol.preguntas{list-style:none;margin:0;padding:0;counter-reset:q;
    display:flex;flex-direction:column;gap:1.6rem;}
  ol.preguntas>li{display:flex;gap:1rem;align-items:baseline;
    border-top:1px solid var(--rule);padding-top:1.4rem;}
  ol.preguntas>li:first-child{border-top:0;padding-top:0;}
  ol.preguntas .qn{font-family:var(--mono);font-weight:700;color:var(--red);
    font-size:14px;letter-spacing:.1em;flex:0 0 auto;}
  ol.preguntas p{margin:0;font-size:clamp(1.12rem,3.8vw,1.3rem);}

  .coda{padding-block:2.4rem 5rem;border-top:1.5px solid var(--ink);}
  .coda .links{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;margin:0 0 1.6rem;}
  .coda .links a{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;text-decoration:none;}
  .coda .src{font-family:var(--mono);font-size:11px;line-height:1.9;letter-spacing:.03em;
    color:var(--hint);margin:0;white-space:pre-line;}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">Picabia · 1920</span>
    <div class="navr">
      <a id="manilink" href="/manifiesto_canibal/">El manifiesto ↗</a>
      <div class="toggle" id="toggle" role="group" aria-label="Idioma / Language">
        <button data-l="es" aria-pressed="true">ES</button>
        <button data-l="fr" aria-pressed="false">FR</button>
        <button data-l="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero" style="border-top:0;">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 class="hero-t"><span id="heroA"></span><span class="o" id="heroO"></span><span id="heroB"></span></h1>
    <p class="thesis" id="thesis"></p>
  </section>

  <section>
    <p class="kicker" id="tesisK"></p>
    <h2 id="tesisH"></h2>
    <div id="tesisBody"></div>
  </section>

  <section>
    <p class="kicker" id="pregK"></p>
    <h2 id="pregH"></h2>
    <ol class="preguntas" id="preg"></ol>
  </section>

  <footer class="coda">
    <div class="links"><a id="guionlink" href="/manifiesto_canibal/guion/"></a><a id="backlink" href="/manifiesto_canibal/"></a></div>
    <p class="src" id="src"></p>
  </footer>
</main>

<script>
const T = {
  es:{
    manilink:"El manifiesto ↗",
    guionlink:"El guion (para imprimir) ↗",
    eyebrow:"SPAN 550B · Semana 5 · Presentación",
    heroA:"Caníbal", heroO:"o", heroB:"Antropófago",
    thesis:"dos digestiones de una misma década",
    tesis:{
      k:"La tesis", h:"Se lo come todo y no digiere nada",
      body:`<p>El título dice <b class="red">caníbal</b>. Dadá se lo traga todo y no digiere <b class="red">nada</b>: la letanía («como sus esperanzas: nada / sus ídolos: nada / sus políticos: nada…») vacía toda la cultura seria. Y en la última línea Dadá <b>se come su propia crítica</b>: «en tres meses, mis amigos y yo les venderemos nuestros cuadros por algunos francos». La antivanguardia se devora a sí misma y sale al mercado.</p>
      <p>Ahí está el eje de mi presentación: el <b>canibalismo dadá</b> de Picabia (consumir y excretar <i>nada</i>) frente a la <b>antropofagia</b> de Oswald de Andrade (<i>Manifesto Antropófago</i>, 1928: devorar al colonizador para <b>transformarlo</b>, no para anularlo). Misma década, digestión opuesta.</p>
      <p class="arrow">Canibalismo → Antropofagia → Consumo</p>
      <p>Ese es, exactamente, el arco del curso.</p>`
    },
    preg:{
      k:"Para la clase", h:"Preguntas de discusión",
      items:[
        `Si Dadá «no es nada, nada, nada», ¿por qué necesita al público de pie? ¿Puede una antivanguardia negarlo todo sin volverse ritual, es decir, otro himno más?`,
        `La última línea vende los cuadros. ¿Es Picabia cínico, o es una crítica lúcida de que toda vanguardia termina como mercancía? ¿Dónde cae hoy esa línea: el arte-NFT, el museo, la marca?`,
        `Picabia consume y no digiere; Andrade digiere para transformar. ¿Cuál de los dos «canibalismos» describe mejor la relación de América Latina con la cultura europea? ¿O hacen falta los dos?`
      ]
    },
    backlink:"← El manifiesto que se come a sí mismo",
    src:`Francis Picabia, «Manifeste cannibale dada». Leído por André Breton en la 3.ª velada Dadá, Théâtre de l’Œuvre, París, 27 de marzo de 1920. Publicado en Dadaphone n.º 7.
Oswald de Andrade, «Manifesto Antropófago», Revista de Antropofagia, São Paulo, 1928.
Presentación de Adri M · SPAN 550B, UBC.`
  },

  fr:{
    manilink:"Le manifeste ↗",
    guionlink:"Le déroulé (à imprimer) ↗",
    eyebrow:"SPAN 550B · Semaine 5 · Présentation",
    heroA:"Cannibale", heroO:"ou", heroB:"Anthropophage",
    thesis:"deux digestions d’une même décennie",
    tesis:{
      k:"La thèse", h:"Il dévore tout et ne digère rien",
      body:`<p>Le titre dit <b class="red">cannibale</b>. Dada avale tout et ne digère <b class="red">rien</b> : la litanie (« comme vos espoirs : rien / vos idoles : rien / vos hommes politiques : rien… ») vide toute la culture sérieuse. Et dans sa dernière ligne, Dada <b>dévore sa propre critique</b> : « dans trois mois, mes amis et moi vous vendrons nos tableaux pour quelques francs ». L’anti-avant-garde se dévore elle-même et sort sur le marché.</p>
      <p>Voilà l’axe de ma présentation : le <b>cannibalisme dada</b> de Picabia (consommer et excréter <i>rien</i>) face à l’<b>anthropophagie</b> d’Oswald de Andrade (<i>Manifeste Anthropophage</i>, 1928 : dévorer le colonisateur pour le <b>transformer</b>, non pour l’annuler). Même décennie, digestion opposée.</p>
      <p class="arrow">Cannibalisme → Anthropophagie → Consommation</p>
      <p>C’est, exactement, l’arc du cours.</p>`
    },
    preg:{
      k:"Pour la classe", h:"Questions de discussion",
      items:[
        `Si Dada « n’est rien, rien, rien », pourquoi a-t-il besoin d’un public debout ? Une anti-avant-garde peut-elle tout nier sans devenir un rituel, c’est-à-dire un hymne de plus ?`,
        `La dernière ligne vend les tableaux. Picabia est-il cynique, ou est-ce une critique lucide : toute avant-garde finit en marchandise ? Où tombe cette ligne aujourd’hui : l’art-NFT, le musée, la marque ?`,
        `Picabia consomme et ne digère pas ; Andrade digère pour transformer. Lequel des deux « cannibalismes » décrit le mieux le rapport de l’Amérique latine à la culture européenne ? Ou faut-il les deux ?`
      ]
    },
    backlink:"← Le manifeste qui se dévore lui-même",
    src:`Francis Picabia, « Manifeste cannibale dada ». Lu par André Breton lors de la 3ᵉ soirée Dada, Théâtre de l’Œuvre, Paris, 27 mars 1920. Publié dans Dadaphone n° 7.
Oswald de Andrade, « Manifeste Anthropophage », Revista de Antropofagia, São Paulo, 1928.
Présentation d’Adri M · SPAN 550B, UBC.`
  },

  en:{
    manilink:"The manifesto ↗",
    guionlink:"The run of show (to print) ↗",
    eyebrow:"SPAN 550B · Week 5 · Presentation",
    heroA:"Cannibal", heroO:"or", heroB:"Anthropophage",
    thesis:"two digestions of one decade",
    tesis:{
      k:"The thesis", h:"It eats everything and digests nothing",
      body:`<p>The title says <b class="red">cannibal</b>. Dada swallows everything and digests <b class="red">nothing</b>: the litany (“like your hopes: nothing / your idols: nothing / your politicians: nothing…”) empties out all of serious culture. And in its last line Dada <b>eats its own critique</b>: “in three months my friends and I will sell you our paintings for a few francs.” The anti-avant-garde devours itself and walks out onto the market.</p>
      <p>That is the axis of my presentation: Picabia’s <b>Dada cannibalism</b> (consume and excrete <i>nothing</i>) against Oswald de Andrade’s <b>anthropophagy</b> (<i>Cannibalist Manifesto</i>, 1928: devour the colonizer in order to <b>transform</b> him, not to annul him). Same decade, opposite digestion.</p>
      <p class="arrow">Cannibalism → Anthropophagy → Consumption</p>
      <p>That is, exactly, the arc of the course.</p>`
    },
    preg:{
      k:"For the class", h:"Discussion questions",
      items:[
        `If Dada “is nothing, nothing, nothing,” why does it need the audience on its feet? Can an anti-avant-garde negate everything without turning into a ritual, that is, just one more anthem?`,
        `The last line sells the paintings. Is Picabia cynical, or is it a lucid critique that every avant-garde ends up as merchandise? Where does that line fall today: NFT-art, the museum, the brand?`,
        `Picabia consumes and does not digest; Andrade digests in order to transform. Which of the two “cannibalisms” better describes Latin America’s relationship to European culture? Or do we need both?`
      ]
    },
    backlink:"← The manifesto that eats itself",
    src:`Francis Picabia, “Manifeste cannibale dada.” Read by André Breton at the 3rd Dada soirée, Théâtre de l’Œuvre, Paris, 27 March 1920. Published in Dadaphone no. 7.
Oswald de Andrade, “Cannibalist Manifesto,” Revista de Antropofagia, São Paulo, 1928.
Presentation by Adri M · SPAN 550B, UBC.`
  }
};

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");

function render(l){
  const d = T[l];
  document.documentElement.lang = l;
  $("manilink").textContent = d.manilink;
  $("eyebrow").textContent = d.eyebrow;
  $("heroA").textContent = d.heroA;
  $("heroO").textContent = d.heroO;
  $("heroB").textContent = d.heroB;
  $("thesis").textContent = d.thesis;
  $("tesisK").textContent = d.tesis.k;
  $("tesisH").textContent = d.tesis.h;
  $("tesisBody").innerHTML = d.tesis.body;
  $("pregK").textContent = d.preg.k;
  $("pregH").textContent = d.preg.h;
  $("preg").innerHTML = d.preg.items.map((q,i)=>
    '<li><span class="qn">'+pad(i+1)+'</span><p>'+q+'</p></li>').join("");
  $("guionlink").textContent = d.guionlink;
  $("backlink").textContent = d.backlink;
  $("src").textContent = d.src;
  document.querySelectorAll("#toggle button")
    .forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===l ? "true":"false"));
}

$("toggle").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const l = b.dataset.l;
  try{ localStorage.setItem("mcd-lang", l); }catch(_){}
  render(l);
});

let start = "es";
try{ const s = localStorage.getItem("mcd-lang"); if(s && T[s]) start = s; }catch(_){}
render(start);
</script>

</body>
</html>
