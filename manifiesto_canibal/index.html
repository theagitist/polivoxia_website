<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.png">
<style>
  *{box-sizing:border-box}
  html{color-scheme:light dark}
  :root{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Manifiesto Caníbal</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Spectral:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --paper:#efe7d6; --ink:#16120c; --red:#c1121f;
    --faint:rgba(22,18,12,.26); --rule:rgba(22,18,12,.2); --hint:rgba(22,18,12,.5);
    --disp:"Anton",Impact,"Haettenschweiler",sans-serif;
    --body:"Spectral",Georgia,"Times New Roman",serif;
    --mono:"Space Mono",ui-monospace,"Courier New",monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#0e0c09; --ink:#efe7d6; --red:#e5493b;
    --faint:rgba(239,231,214,.24); --rule:rgba(239,231,214,.18); --hint:rgba(239,231,214,.55);
  }}
  :root[data-theme="dark"]{
    --paper:#0e0c09; --ink:#efe7d6; --red:#e5493b;
    --faint:rgba(239,231,214,.24); --rule:rgba(239,231,214,.18); --hint:rgba(239,231,214,.55);
  }

  body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.5;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .wrap{max-width:44rem;margin:0 auto;padding-inline:20px;}

  /* the mouth — the jaw of DADÁ, where the text gets digested */
  #mouth{position:fixed;left:0;right:0;top:20%;z-index:5;pointer-events:none;
    display:flex;align-items:center;}
  /* the lip: a red line with a row of downward fangs hanging under it */
  #mouth .lip{flex:1;height:3px;background:var(--red);position:relative;}
  #mouth .lip::after{content:"";position:absolute;left:0;right:0;top:3px;height:8px;
    background:linear-gradient(-135deg,var(--red) 49%,transparent 51%) 0 0/11px 8px repeat-x;}
  #mouth b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--paper);background:var(--red);font-weight:700;padding:4px 9px;white-space:nowrap;
    display:inline-flex;gap:.55em;align-items:baseline;animation:gnash 1.5s ease-in-out infinite;}
  #mouth b .n{font-variant-numeric:tabular-nums;font-size:12px;}
  @keyframes gnash{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}

  /* header */
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;
    background:color-mix(in srgb,var(--paper) 88%,transparent);
    backdrop-filter:blur(6px);border-bottom:1.5px solid var(--ink);}
  .bar{max-width:44rem;margin:0 auto;padding:10px 20px;display:flex;align-items:baseline;
    justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brand{font-family:var(--mono);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:11px;}
  .navr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .toggle{display:flex;gap:2px;border:1.5px solid var(--ink);}
  .toggle button{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.1em;
    background:transparent;color:var(--ink);border:0;padding:8px 11px;min-height:36px;cursor:pointer;}
  .toggle button[aria-pressed="true"]{background:var(--ink);color:var(--paper);}
  .toggle button:focus-visible{outline:2px solid var(--red);outline-offset:2px;}
  .soundbtn{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;background:transparent;color:var(--ink);border:1.5px solid var(--ink);
    padding:7px 10px;min-height:36px;cursor:pointer;white-space:nowrap;}
  .soundbtn[aria-pressed="true"]{background:var(--red);color:var(--paper);border-color:var(--red);}
  .soundbtn:focus-visible{outline:2px solid var(--red);outline-offset:2px;}
  .fsbtn{font-family:var(--mono);font-size:15px;line-height:1;background:transparent;color:var(--ink);
    border:1.5px solid var(--ink);padding:0 9px;min-height:36px;min-width:36px;cursor:pointer;}
  .fsbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);}
  .fsbtn:focus-visible{outline:2px solid var(--red);outline-offset:2px;}

  /* hero */
  .hero{padding-block:14vh 8vh;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--red);margin:0 0 1.2rem;}
  .dadahero{font-family:var(--disp);font-weight:400;color:var(--red);line-height:.82;
    font-size:clamp(4.5rem,26vw,13rem);margin:0;letter-spacing:-.02em;
    text-transform:uppercase;word-break:break-word;}
  .thesis{font-family:var(--disp);font-weight:400;text-transform:uppercase;line-height:.95;
    font-size:clamp(1.6rem,7vw,3rem);margin:.4rem 0 0;text-wrap:balance;}
  .scrollcue{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--hint);margin-top:2.4rem;display:flex;align-items:center;gap:.6em;}
  .scrollcue::before{content:"";width:2.2em;height:1px;background:var(--hint);}

  /* manifesto */
  .st{font-size:clamp(1.15rem,4.6vw,1.5rem);margin:1.35em 0;text-wrap:pretty;}
  .st.open{font-family:var(--disp);text-transform:uppercase;font-weight:400;
    font-size:clamp(1.7rem,7vw,2.6rem);line-height:1.02;margin-bottom:.6em;}
  .st.line{margin:.15em 0;font-style:italic;}
  .st.line.last{margin-bottom:1.2em;}
  .st.litany{margin:.12em 0;font-size:clamp(1.25rem,5.4vw,1.8rem);}
  .st.beat{font-family:var(--disp);text-transform:uppercase;color:var(--red);
    font-size:clamp(1.6rem,8vw,2.8rem);letter-spacing:.02em;margin:.5em 0;}

  .w{display:inline-block;transition:opacity .3s ease,transform .3s ease,color .3s;}
  .w.dada{font-family:var(--disp);color:var(--red);text-transform:uppercase;}
  .w.nihil{font-family:var(--disp);color:var(--red);text-transform:uppercase;}
  .litany .w.nihil{font-size:1.15em;}
  /* getting eaten: flare red, bite down, then get crushed and sucked up into the mouth */
  @keyframes chomp{
    0%{opacity:1;transform:none;}
    22%{color:var(--red);transform:scale(1.22) rotate(-2deg);}
    50%{color:var(--red);transform:scale(.82) rotate(3deg) skewX(-6deg);}
    100%{opacity:0;color:var(--red);transform:translateY(-1.5em) scale(.12) rotate(-16deg);filter:blur(1.5px);}
  }
  .w.eaten{animation:chomp .5s cubic-bezier(.55,0,.9,.25) forwards;}

  /* the void + the surviving line */
  .void{min-height:62vh;display:flex;align-items:flex-end;}
  .void p{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--faint);margin:0;}
  .punch{font-family:var(--body);font-size:clamp(1.4rem,6vw,2.1rem);line-height:1.32;
    border-top:2px solid var(--red);padding-top:1.4rem;margin:0 0 8vh;}
  .punch em{font-style:normal;color:var(--red);}

  /* coda */
  .coda{border-top:1.5px solid var(--ink);padding-block:2.4rem 5rem;}
  .coda .note{font-size:1.05rem;margin:0 0 1.6rem;}
  .coda .note b{color:var(--red);font-weight:600;}
  .coda .src{font-family:var(--mono);font-size:11px;line-height:1.8;letter-spacing:.03em;
    color:var(--hint);margin:0;}
  .coda .more{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;margin:0 0 1.4rem;}
  .coda a{color:var(--red);text-underline-offset:3px;text-decoration-thickness:1px;}

  @media (prefers-reduced-motion:reduce){
    #mouth b{animation:none;}
    .w{transition:opacity .25s ease,color .25s;}
    .w.eaten{animation:none;opacity:.12;color:var(--red);text-decoration:line-through;
      text-decoration-color:var(--red);text-decoration-thickness:2px;}
  }
</style>
</head>

</main>

const NIHIL = {nada:1,rien:1,nothing:1};
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function words(t){
  return t.split(/(\s+)/).map(tok=>{
    if(tok===""||/^\s+$/.test(tok)) return tok;
    const clean = tok.replace(/[.,:;—–?¡!"'»«’()]/g,"").toLowerCase();
    let c="w";
    if(clean==="dada"||clean==="dadá") c+=" dada";
    else if(NIHIL[clean]) c+=" nihil";
    return '<span class="'+c+'">'+esc(tok)+'</span>';
  }).join("");
}

const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
let mouth, eaten = 0;
const counter = document.querySelector("#mouth .n");

function wire(){
  if(mouth) mouth.disconnect();
  eaten = 0; if(counter) counter.textContent = "0";
  mouth = new IntersectionObserver(entries=>{
    for(const e of entries){
      if(e.isIntersecting) continue;
      const line = e.rootBounds ? e.rootBounds.top : innerHeight*0.2;
      const el = e.target;
      const bite = e.boundingClientRect.top < line;
      if(bite === el.classList.contains("eaten")) continue; // no state change
      el.classList.toggle("eaten", bite);
      eaten += bite ? 1 : -1;
      if(counter) counter.textContent = eaten;
    }
  }, {rootMargin:"-20% 0px -79% 0px", threshold:0});
  document.querySelectorAll("#stage .w").forEach(w=>mouth.observe(w));
}

function render(l){
  const d = T[l];
  curLang = l;
  document.documentElement.lang = l;
  $("eyebrow").textContent = d.eyebrow;
  $("hero").textContent = d.hero;
  $("thesis").textContent = d.thesis;
  $("cue").textContent = d.cue;
  $("voidlabel").textContent = d.void;
  document.querySelector("#mouth .lbl").textContent = d.mouth;
  $("stage").innerHTML = d.stanzas
    .map(s=>'<p class="st '+s.k+'">'+words(s.t)+'</p>').join("");
  $("punch").innerHTML = d.punch;
  $("coda").innerHTML = d.coda;
  $("source").textContent = d.source;
  $("audiocredit").textContent = d.audio;
  soundLabel();
  document.querySelectorAll("#toggle button")
    .forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===l ? "true":"false"));
  wire();
}

/* ---- background audio (opt-in; swells as you descend into the void) ---- */
const bed = $("bed"), sbtn = $("soundbtn");
let soundOn = false, curLang = "es";
function soundLabel(){ sbtn.textContent = (soundOn?"● ":"○ ") + T[curLang].sound; }
// volume tracks scroll depth: a murmur up top, fuller in the emptied-out void
function bedVol(){
  const h = document.documentElement.scrollHeight - innerHeight;
  const p = h > 0 ? Math.min(1, Math.max(0, scrollY / h)) : 0;
  return 0.18 + 0.62 * p;
}
sbtn.addEventListener("click", ()=>{
  soundOn = !soundOn;
  sbtn.setAttribute("aria-pressed", soundOn);
  soundLabel();
  if(soundOn){ bed.volume = bedVol(); bed.play().catch(()=>{}); }
  else bed.pause();
});
addEventListener("scroll", ()=>{ if(soundOn) bed.volume = bedVol(); }, {passive:true});
// only reveal the control (and the credit) once the audio file actually exists
fetch("audio/canibal-bed.mp3", {method:"HEAD"}).then(r=>{
  if(r.ok){ sbtn.hidden = false; $("audiocredit").hidden = false; }
}).catch(()=>{});

$("toggle").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const l = b.dataset.l;
  try{ localStorage.setItem("mcd-lang", l); }catch(_){}
  render(l);
  scrollTo({top:0, behavior:"instant" in document.body.style ? "instant":"auto"});
});

let start = "es";
try{ const s = localStorage.getItem("mcd-lang"); if(s && T[s]) start = s; }catch(_){}
render(start);

const fsbtn = document.getElementById("fsbtn");
if(fsbtn && document.documentElement.requestFullscreen){
  fsbtn.hidden = false;
  fsbtn.addEventListener("click", ()=>{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>{});
  });
  document.addEventListener("fullscreenchange", ()=>{
    const on = !!document.fullscreenElement;
    fsbtn.setAttribute("aria-pressed", on);
    fsbtn.textContent = on ? "⤡" : "⤢";
  });
}
</script>

</body>
</html>
