<style>

  a{color:var(--red);text-underline-offset:3px;text-decoration-thickness:1px;}

  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;
    background:color-mix(in srgb,var(--paper) 88%,transparent);

  .bar{max-width:46rem;margin:0 auto;padding:10px 20px;display:flex;align-items:center;

  .brand{font-family:var(--mono);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11px;}

  .printbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .toggle{display:flex;gap:2px;border:1.5px solid var(--ink);}
  .toggle button{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.1em;
    background:transparent;color:var(--ink);border:0;padding:8px 11px;min-height:36px;cursor:pointer;}

  .fsbtn{font-family:var(--mono);font-size:15px;line-height:1;background:transparent;color:var(--ink);
    border:1.5px solid var(--ink);padding:0 9px;min-height:36px;min-width:36px;cursor:pointer;}
  .fsbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);}

  h1{font-family:var(--disp);font-weight:400;text-transform:uppercase;line-height:.9;

  .sub{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;

  .note{font-size:1.02rem;margin:1.4rem 0 0;color:var(--ink);text-wrap:pretty;}

  .handout-head{margin:0 0 1.8rem;}
  .hoTitle{font-family:var(--disp);text-transform:uppercase;line-height:.95;

  .preg h2{font-family:var(--disp);font-weight:400;text-transform:uppercase;
    font-size:clamp(1.6rem,7vw,2.4rem);line-height:1;margin:0 0 1.2rem;}
  ol.preguntas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.2rem;}
  ol.preguntas>li{display:flex;gap:1rem;align-items:baseline;}

    font-size:14px;letter-spacing:.1em;flex:0 0 auto;}
  ol.preguntas p{margin:0;font-size:1.08rem;text-wrap:pretty;}

  .coda{padding-block:2.4rem 5rem;margin-top:2.6rem;border-top:1.5px solid var(--rule);}
  .coda .dl{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    margin:0 0 1.4rem;}
  .coda .dl a{font-weight:700;text-decoration:none;}
  .coda .src{font-family:var(--mono);font-size:11px;line-height:1.9;letter-spacing:.03em;
    color:var(--hint);margin:0;white-space:pre-line;}

  @media print{
    :root{--paper:#fff;--ink:#000;--red:#000;--hint:#000;--rule:#999;--faint:#999;}

    body{background:#fff;color:#000;font-size:12.5pt;line-height:1.5;}
    .wrap{max-width:none;padding:0;}
    .head{padding:0 0 1rem;}
    .eyebrow{font-size:10.5pt;margin:0 0 .6rem;}
    h1{font-size:37pt;color:#000;margin:0;}
    .sub{font-size:10.5pt;margin:.5rem 0 0;}
    .note{font-size:12pt;margin:1rem 0 0;}
    .eyebrow,.sub,.time{color:#000;}
    blockquote{background:none;border-left:4px solid #000;color:#000;font-size:17.5pt;
      margin:.9rem 0;padding:.55rem 1rem;}
    ol.guion{gap:1.5rem;padding-top:1.4rem;}
    ol.guion>li{break-inside:auto;}  /* let beats flow; break-inside:avoid caused whole beats to jump pages unevenly per language */
    ol.guion .num{font-size:37pt;}
    ol.guion .step h3{font-size:17.5pt;margin:0 0 .55rem;}
    .time{font-size:10.5pt;margin:0 0 .38rem;}
    ol.guion .step p{font-size:12.5pt;margin:0 0 .7rem;}
    .arrow{font-size:16pt;margin:.8rem 0 .6rem;}
    a{color:#000;text-decoration:none;}
    /* last page = a printable discussion handout */
    .preg{break-before:page;page-break-before:always;border-top:0;margin-top:0;padding-top:0;}
    .handout-head{margin:0 0 1.6rem;padding-bottom:1.2rem;border-bottom:2px solid #000;}
    .hoTitle{font-size:27pt;}
    .preg h2{font-size:24pt;margin:0 0 1.6rem;}
    ol.preguntas{gap:2.3rem;}
    ol.preguntas>li{padding-top:0;}
    ol.preguntas .qn{font-size:15pt;}
    ol.preguntas p{font-size:15pt;line-height:1.5;}
    .coda{margin-top:2.2rem;padding:0;border-top:1px solid #000;padding-top:1rem;break-inside:avoid;}
    .coda .src{font-size:9.5pt;line-height:1.55;color:#000;}
    @page{margin:1.1cm;}
  }
</style>

<script>
const T = {
  es:{
    lang:"es", printbtn:"Imprimir / PDF", dl:"Descargar PDF:",
    preslink:"La presentación ↗", manilink:"El manifiesto ↗",
    eyebrow:"SPAN 550B · Semana 5 · Guion",
    title:"El guion",
    sub:"≈ 8–10 min · tres tiempos · actividad reproducible",
    note:`Protocolo reproducible para reactivar el <i>Manifeste cannibale dada</i> de Picabia como acontecimiento en un seminario. En vez de resumir el texto, quien facilita <b>hace lo que el texto ordena</b>. Cualquiera puede ejecutarlo. En <b class="red">rojo y negrita</b>, lo que se lee en voz alta.`,
    steps:[
      {time:"1 · Apertura en personaje · reenactment · ~2 min", h:"Hacer lo que el texto ordena",
       body:`<p>Entrar sin explicar nada y leer el arranque como una orden:</p>
       <blockquote>«Son todos ustedes acusados; levántense. El orador no puede hablarles si no están de pie.»</blockquote>
       <p>Hacer que la clase <b>se ponga de pie</b> y leer la letanía del ponerse de pie: «de pie como ante La Marsellesa… ante el himno ruso… ante el <i>God save the King</i>… ante la bandera… en fin, de pie ante DADÁ». El texto equipara a Dadá con el himno y la bandera y, de paso, <b>acusa</b> al público: querer lo que sea «por esnobismo, siempre y cuando cueste caro».</p>
       <p>Sentar a la clase con «¿Se han sentado todos de nuevo? Tanto mejor, así me escuchan con más atención» y <b>romper el personaje</b>. En dos minutos el público ya fue convertido en mercancía: eso es justo lo que se va a leer.</p>`},
      {time:"2 · La lectura · canibalismo → consumo · ~5 min", h:"Deshago lo que acaba de pasar",
       body:`<p><b>a) La cadena de equivalencias.</b> El manifiesto no argumenta: <b>encadena</b>. «Hacinados como ostras serias», y de la seriedad salta a la muerte («serios hasta la muerte»; «uno muere como un héroe o como un idiota, que es lo mismo»), de la muerte al dinero («sólo el dinero no muere, se va de viaje»), del dinero a Dios y al honor («el hombre que tiene dinero es un hombre honorable»), y del honor al cuerpo obsceno («el honor se compra y se vende como el culo… olerán peor que la mierda de vaca»). Seriedad = muerte = dinero = Dios = honor = mierda: toda la cultura burguesa reducida a una sola digestión.</p>
       <p><b>b) La letanía del <span class="red">nada</span>.</b> Entonces Dadá se lo traga todo y no excreta nutriente: «no huele a nada, no es nada, nada, nada». Recorrer la lista (esperanzas, paraísos, ídolos, políticos, héroes, artistas, religiones) respondiendo <b class="red">nada</b> a cada una. Es canibalismo puro: consumir para <b>anular</b>, no para transformar.</p>
       <p><b>c) El giro autocaníbal.</b> Y en la última línea Dadá se come su propia crítica: «silben, gríten, rómpanme la jeta… en tres meses, mis amigos y yo les venderemos nuestros cuadros por algunos francos». La antivanguardia que negó el dinero y la seriedad <b>vuelve al mercado</b>. La negación se hace mercancía: aquí el <b>canibalismo</b> se vuelve <b>consumo</b>.</p>
       <p><b>d) El contraste: Andrade.</b> Comparar con el <i>Manifesto Antropófago</i> de Oswald de Andrade (1928): la antropofagia devora al colonizador para <b>metabolizarlo</b> y crear algo nuevo (el modernismo brasileño). Misma década, digestión opuesta: Picabia consume y no digiere; Andrade digiere para <b>transformar</b>.</p>
       <p class="arrow">Canibalismo → Calibanismo → Antropofagia → Consumo</p>
       <p>Ese es el arco del curso, y la última línea de Picabia es la bisagra hacia el <b>consumo</b>.</p>`},
      {time:"3 · Interacción + cierre · ~3 min", h:"Letanía en llamada y respuesta",
       body:`<p><b>Llamada y respuesta.</b> Repetir la letanía, ahora con la clase: quien facilita dice el sustantivo («sus ídolos», «sus héroes», «sus artistas», «sus religiones») y todos responden <b class="red">«¡nada!»</b>. El aula <b>ejecuta</b> el vaciamiento en vez de escucharlo.</p>
       <p><b>Aterrizaje en el presente.</b> Cerrar volviendo a la venta de los cuadros: ¿dónde cae hoy esa línea? El arte-NFT, la marca, el museo. La vanguardia que se vendió «por algunos francos» es ya nuestro mercado del arte.</p>
       <p>Lanzar las <b>preguntas de discusión</b> (página siguiente) y mostrar la <a href="/manifiesto_canibal/">pieza web</a>, donde el manifiesto se devora a sí mismo al hacer scroll.</p>`}
    ],
    hoTitle:"Manifeste cannibale dada",
    pregH:"Preguntas de discusión (cierre)",
    preg:[
      `Si Dadá «no es nada, nada, nada», ¿por qué necesita al público de pie? ¿Puede una antivanguardia negarlo todo sin volverse ritual, es decir, otro himno más?`,
      `La última línea vende los cuadros. ¿Es Picabia cínico, o es una crítica lúcida de que toda vanguardia termina como mercancía? ¿Dónde cae hoy esa línea: el arte-NFT, el museo, la marca?`,
      `Picabia consume y no digiere; Andrade digiere para transformar. ¿Cuál de los dos «canibalismos» describe mejor la relación de América Latina con la cultura europea? ¿O hacen falta los dos?`
    ],
    src:`Francis Picabia, «Manifeste cannibale dada». Leído por André Breton en la 3.ª velada Dadá, Théâtre de l’Œuvre, París, 27 de marzo de 1920. Publicado en Dadaphone n.º 7.
Oswald de Andrade, «Manifesto Antropófago», Revista de Antropofagia, São Paulo, 1928.

  fr:{
    lang:"fr", printbtn:"Imprimer / PDF", dl:"Télécharger le PDF :",
    preslink:"La présentation ↗", manilink:"Le manifeste ↗",
    eyebrow:"SPAN 550B · Semaine 5 · Déroulé",
    title:"Le déroulé",
    sub:"≈ 8–10 min · trois temps · activité reproductible",
    note:`Protocole reproductible pour réactiver le <i>Manifeste cannibale dada</i> de Picabia comme événement dans un séminaire. Au lieu de le résumer, la personne qui anime <b>fait ce que le texte ordonne</b>. N’importe qui peut l’exécuter. En <b class="red">rouge gras</b>, ce qui se lit à voix haute.`,
    steps:[
      {time:"1 · Ouverture en personnage · reenactment · ~2 min", h:"Faire ce que le texte ordonne",
       body:`<p>Entrer sans rien expliquer et lire l’ouverture comme un ordre :</p>
       <blockquote>« Vous êtes tous accusés ; levez-vous. L’orateur ne peut vous parler que si vous êtes debout. »</blockquote>
       <p>Faire <b>lever la classe</b> et lire la litanie du debout : « debout comme pour la Marseillaise… pour l’hymne russe… pour le <i>God save the King</i>… devant le drapeau… enfin debout devant DADA ». Le texte met Dada au rang de l’hymne et du drapeau et, au passage, <b>accuse</b> le public : « tout aimer par snobisme, du moment que cela coûte cher ».</p>
       <p>Rasseoir la classe avec « Vous vous êtes tous rassis ? Tant mieux, comme cela vous allez m’écouter avec plus d’attention » et <b>rompre le personnage</b>. En deux minutes le public a déjà été transformé en public-marchandise : c’est exactement cela que l’on va lire.</p>`},
      {time:"2 · La lecture · cannibalisme → consommation · ~5 min", h:"Je défais ce qui vient de se passer",
       body:`<p><b>a) La chaîne d’équivalences.</b> Le manifeste n’argumente pas : il <b>enchaîne</b>. « Parqués comme des huîtres sérieuses », puis du sérieux à la mort (« sérieux jusqu’à la mort » ; « on meurt en héros ou en idiot, c’est la même chose »), de la mort à l’argent (« il n’y a que l’argent qui ne meurt pas »), de l’argent à Dieu et à l’honneur (« l’homme qui a de l’argent est un homme honorable »), et de l’honneur au corps obscène (« l’honneur s’achète et se vend comme le cul… vous sentirez plus mauvais que la merde de vache »). Sérieux = mort = argent = Dieu = honneur = merde : toute la culture bourgeoise réduite à une seule digestion.</p>
       <p><b>b) La litanie du <span class="red">rien</span>.</b> Alors Dada avale tout et n’excrète aucun nutriment : « il ne sent rien, il n’est rien, rien, rien ». Parcourir la liste (espoirs, paradis, idoles, hommes politiques, héros, artistes, religions) en répondant <b class="red">rien</b> à chacune. Cannibalisme pur : consommer pour <b>annuler</b>, non pour transformer.</p>
       <p><b>c) Le retournement autocannibale.</b> Et dans la dernière ligne Dada dévore sa propre critique : « sifflez, criez, cassez-moi la gueule… dans trois mois, mes amis et moi vous vendrons nos tableaux pour quelques francs ». L’anti-avant-garde qui niait l’argent et le sérieux <b>revient sur le marché</b>. La négation se fait marchandise : ici le <b>cannibalisme</b> devient <b>consommation</b>.</p>
       <p><b>d) Le contraste : Andrade.</b> Comparer au <i>Manifeste Anthropophage</i> d’Oswald de Andrade (1928) : l’anthropophagie dévore le colonisateur pour le <b>métaboliser</b> et créer du neuf (le modernisme brésilien). Même décennie, digestion opposée : Picabia consomme et ne digère pas ; Andrade digère pour <b>transformer</b>.</p>
       <p class="arrow">Cannibalisme → Calibanisme → Anthropophagie → Consommation</p>
       <p>C’est l’arc du cours, et la dernière ligne de Picabia en est la charnière vers la <b>consommation</b>.</p>`},
      {time:"3 · Interaction + clôture · ~3 min", h:"Litanie en appel et réponse",
       body:`<p><b>Appel et réponse.</b> Reprendre la litanie, mais avec la classe : la personne qui anime dit le substantif (« vos idoles », « vos héros », « vos artistes », « vos religions ») et tous répondent <b class="red">« rien ! »</b>. La salle <b>exécute</b> le vidage au lieu de l’écouter.</p>
       <p><b>Atterrissage dans le présent.</b> Clore en revenant à la vente des tableaux : où tombe cette ligne aujourd’hui ? L’art-NFT, la marque, le musée. L’avant-garde qui s’est vendue « pour quelques francs », c’est déjà notre marché de l’art.</p>
       <p>Lancer les <b>questions de discussion</b> (page suivante) et montrer la <a href="/manifiesto_canibal/">pièce web</a>, où le manifeste se dévore lui-même au défilement.</p>`}
    ],
    hoTitle:"Manifeste cannibale dada",
    pregH:"Questions de discussion (clôture)",
    preg:[
      `Si Dada « n’est rien, rien, rien », pourquoi a-t-il besoin d’un public debout ? Une anti-avant-garde peut-elle tout nier sans devenir un rituel, c’est-à-dire un hymne de plus ?`,
      `La dernière ligne vend les tableaux. Picabia est-il cynique, ou est-ce une critique lucide : toute avant-garde finit en marchandise ? Où tombe cette ligne aujourd’hui : l’art-NFT, le musée, la marque ?`,
      `Picabia consomme et ne digère pas ; Andrade digère pour transformer. Lequel des deux « cannibalismes » décrit le mieux le rapport de l’Amérique latine à la culture européenne ? Ou faut-il les deux ?`
    ],
    src:`Francis Picabia, « Manifeste cannibale dada ». Lu par André Breton lors de la 3ᵉ soirée Dada, Théâtre de l’Œuvre, Paris, 27 mars 1920. Publié dans Dadaphone n° 7.
Oswald de Andrade, « Manifeste Anthropophage », Revista de Antropofagia, São Paulo, 1928.

    sub:"≈ 8–10 min · three beats · reproducible activity",
    note:`A reproducible protocol for reactivating Picabia’s <i>Manifeste cannibale dada</i> as an event in a seminar. Instead of summarizing the text, the facilitator <b>does what the text orders</b>. Anyone can run it. In <b class="red">red bold</b>, the lines read aloud.`,
    steps:[
      {time:"1 · Opening in character · reenactment · ~2 min", h:"Do what the text orders",
       body:`<p>Enter without explaining anything and read the opening as a command:</p>
       <blockquote>“You are all accused; stand up. The speaker cannot address you unless you are standing.”</blockquote>
       <p>Get the class to <b>stand</b> and read the standing litany: “stand as for the Marseillaise… the Russian anthem… <i>God save the King</i>… the flag… and finally stand before DADA.” The text ranks Dada with the anthem and the flag and, in passing, <b>accuses</b> the audience: “loving anything out of snobbery, as long as it costs a lot.”</p>
       <p>Sit the class with “Have you all sat down again? So much the better; now you will listen more closely,” and <b>break character</b>. In two minutes the audience has already been turned into a commodity: that is exactly what is about to be read.</p>`},
      {time:"2 · The reading · cannibalism → consumption · ~5 min", h:"Undo what just happened",
       body:`<p><b>a) The chain of equivalences.</b> The manifesto doesn’t argue, it <b>chains</b>. “Penned in like serious oysters,” then from seriousness to death (“serious unto death”; “you die a hero or an idiot, which is the same”), from death to money (“only money doesn’t die, it just goes travelling”), from money to God and honour (“the man who has money is an honourable man”), and from honour to the obscene body (“honour is bought and sold like the arse… you will stink worse than cow dung”). Serious = death = money = God = honour = shit: all of bourgeois culture reduced to a single digestion.</p>
       <p><b>b) The litany of <span class="red">nothing</span>.</b> Then Dada swallows it all and excretes no nutrient: “it smells of nothing, it is nothing, nothing, nothing.” Run the list (hopes, paradises, idols, politicians, heroes, artists, religions), answering <b class="red">nothing</b> to each. Pure cannibalism: consuming to <b>annul</b>, not to transform.</p>
       <p><b>c) The self-cannibal turn.</b> In the last line Dada eats its own critique: “whistle, shout, smash my face in… in three months my friends and I will sell you our paintings for a few francs.” The anti-avant-garde that denied money and seriousness <b>walks back onto the market</b>. Negation becomes a commodity: here <b>cannibalism</b> turns into <b>consumption</b>.</p>
       <p><b>d) The contrast: Andrade.</b> Compare with Oswald de Andrade’s <i>Cannibalist Manifesto</i> (1928): anthropophagy devours the colonizer in order to <b>metabolize</b> him and make something new (Brazilian modernism). Same decade, opposite digestion: Picabia consumes and does not digest; Andrade digests to <b>transform</b>.</p>
       <p class="arrow">Cannibalism → Calibanism → Anthropophagy → Consumption</p>
       <p>That is the arc of the course, and Picabia’s last line is the hinge toward <b>consumption</b>.</p>`},
      {time:"3 · Interaction + closing · ~3 min", h:"Call-and-response litany",
       body:`<p><b>Call and response.</b> Run the litany again, now with the class: the facilitator says the noun (“your idols,” “your heroes,” “your artists,” “your religions”) and everyone answers <b class="red">“nothing!”</b>. The room <b>enacts</b> the emptying instead of hearing it.</p>
       <p><b>Landing in the present.</b> Close by returning to the sale of the paintings: where does that line fall today? NFT-art, the brand, the museum. The avant-garde that sold itself “for a few francs” is already our art market.</p>
       <p>Pose the <b>discussion questions</b> (next page) and show the <a href="/manifiesto_canibal/">web piece</a>, where the manifesto devours itself as you scroll.</p>`}

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");

function render(l){
  const d = T[l];
  document.documentElement.lang = d.lang;
  $("printbtn").textContent = d.printbtn;
  $("preslink").textContent = d.preslink;
  $("manilink").textContent = d.manilink;
  $("eyebrow").textContent = d.eyebrow;
  $("title").textContent = d.title;
  $("sub").textContent = d.sub;
  $("note").innerHTML = d.note;
  $("guion").innerHTML = d.steps.map((s,i)=>
    '<li><div class="num">'+(i+1)+'</div><div class="step">'
    +'<p class="time">'+s.time+'</p><h3>'+s.h+'</h3>'+s.body+'</div></li>').join("");
  $("hoTitle").textContent = d.hoTitle;
  $("pregH").textContent = d.pregH;
  $("preg").innerHTML = d.preg.map((q,i)=>
    '<li><span class="qn">'+pad(i+1)+'</span><p>'+q+'</p></li>').join("");
  const v = "?v=20261004e"; // bump when the PDFs are regenerated (Cloudflare caches them 30d; can't purge from here)
  $("dl").innerHTML = d.dl
    + ' <a href="guion-es.pdf'+v+'" target="_blank" rel="noopener">ES</a>'
    + ' · <a href="guion-fr.pdf'+v+'" target="_blank" rel="noopener">FR</a>'
    + ' · <a href="guion-en.pdf'+v+'" target="_blank" rel="noopener">EN</a>';
  $("src").textContent = d.src;
  document.querySelectorAll("#toggle button")
    .forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===l ? "true":"false"));
}

$("toggle").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const l = b.dataset.l;
  try{ localStorage.setItem("mcd-lang", l); }catch(_){}
  render(l);
});

let start = "es";
try{ const s = localStorage.getItem("mcd-lang"); if(s && T[s]) start = s; }catch(_){}
const qp = new URLSearchParams(location.search).get("lang"); if(qp && T[qp]) start = qp; // for the per-language PDF render
render(start);

const fsbtn = document.getElementById("fsbtn");
if(fsbtn && document.documentElement.requestFullscreen){
  fsbtn.hidden = false;
  fsbtn.addEventListener("click", ()=>{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>{});
  });
  document.addEventListener("fullscreenchange", ()=>{
    const on = !!document.fullscreenElement;
    fsbtn.setAttribute("aria-pressed", on);
    fsbtn.textContent = on ? "⤡" : "⤢";
  });
}
</script>
