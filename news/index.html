<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="News from Adri M.'s projects: releases, awards and events.">
<title>News · POLIVOXIA.CA</title>
<link rel="canonical" href="https://polivoxia.ca/news/">
<meta property="og:image" content="https://polivoxia.ca/assets/img/og.jpg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/site.css?v=20">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>
<div class="strip"><a href="/" class="home">POLIVOXIA.CA</a><span data-i18n="strip">Portfolio of liminal spaces</span>
  <nav class="lang-switch" aria-label="Language"><a href="?lang=en" hreflang="en" lang="en">EN</a><a href="?lang=fr" hreflang="fr" lang="fr">FR</a><a href="?lang=es" hreflang="es" lang="es">ES</a><a href="?lang=pt" hreflang="pt" lang="pt">PT</a></nav></div>

<main id="main" class="newspage">
  <a class="back" href="/"><span aria-hidden="true">← </span><span data-i18n="back">Back to the homepage</span></a>
  <h1 data-i18n="newsTitle">News</h1>
  <p class="intro" data-i18n="newsIntro">Releases, awards and events across my projects, newest first.</p>
  <div id="years"></div>
</main>

<footer><span>© Adri M.</span><span data-i18n="footer">Art · Computers · Community</span></footer>

<script src="/assets/i18n.js?v=15"></script>
<script>
applyI18n();
document.title = (T.ui?.newsTitle || 'News') + ' · POLIVOXIA.CA';

// every item, grouped by year, newest first
loadNews().then(items => {
  const years = [...new Set(items.map(e => e.date.slice(0, 4)))];
  document.getElementById('years').innerHTML = years.map(y => `
    <section class="year" aria-labelledby="y${y}">
      <h2 id="y${y}">${y}</h2>
      <ol class="news-list news-full">${items.filter(e => e.date.startsWith(y)).map(e => { const l = newsLink(e); return `
        <li><div class="news-item${e.highlight ? ' hl' : ''}" data-kind="${e.kind}">
          ${hlBadge(e)}
          <span class="news-meta"><time datetime="${e.date}">${newsDate(e.date)}</time> · <span class="kind">${T.kinds[e.kind]}</span></span>
          <span class="news-proj">${e.project}</span>
          <h3 class="news-title">${l ? `<a href="${l.href}"${l.ext}>${pick(e.title)}</a>${l.tag}` : pick(e.title)}</h3>
          <p class="news-text">${pick(e.text)}</p>
        </div></li>`; }).join('')}
      </ol>
    </section>`).join('');
});
</script>
</body>
</html>
